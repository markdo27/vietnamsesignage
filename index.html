<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1d5c4f">
  <title>Phố Bảng Hiệu — tường bảng hiệu Sài Gòn 1985</title>
  <meta name="description" content="Một bức tường bảng hiệu Việt Nam lấp đầy màn hình: kéo mép để đổi cỡ, bấm vào chữ để sửa, đổi qua lại giữa Sài Gòn 1985 và phố hôm nay.">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Phố Bảng Hiệu — tường bảng hiệu Sài Gòn 1985">
  <meta property="og:description" content="Một bức tường bảng hiệu Việt Nam lấp đầy màn hình. Kéo mép để đổi cỡ, bấm vào chữ để sửa, đổi qua lại giữa Sài Gòn 1985 và phố hôm nay.">
  <meta property="og:url" content="https://markdo27.github.io/vietnamsesignage/">
  <meta property="og:image" content="https://markdo27.github.io/vietnamsesignage/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="vi_VN">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Alfa+Slab+One&family=Allura&family=Anton&family=Archivo:wdth,wght@62..125,400..900&family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Bevan&family=Bitter:wght@600;700&family=Charmonman:wght@700&family=Chivo:wght@700;900&family=Dancing+Script:wght@700&family=EB+Garamond:wght@500;600;700&family=Ephesis&family=Great+Vibes&family=Italianno&family=Kanit:wght@600&family=Lobster&family=Mea+Culpa&family=Oswald:wght@600&family=Pinyon+Script&family=Playfair+Display:wght@900&family=Saira+Condensed:wght@700&family=Tektur:wght@600;700&family=Yeseva+One&display=swap">
  <link rel="stylesheet" href="plaza.css">
</head>
<body>
  <!-- the wall: every sign is drawn here by plaza.js -->
  <main class="wall" id="wall" aria-label="Tường bảng hiệu"></main>

  <div class="dock" id="dock">
    <div class="dock-brand">
      <b id="brand">Sàigòn 1985</b>
      <span id="brandNote">BỘ PHÔNG CHỮ BIỂN HIỆU SÀI GÒN XƯA</span>
    </div>
    <div class="dock-actions">
      <!-- what is on the wall -->
      <div class="dock-group" role="group" aria-label="Nội dung">
        <button type="button" data-act="shuffle" aria-label="Xáo toàn bộ phố" title="Đổi toàn bộ tiệm (R)"><i>🎲</i><span>XÁO PHỐ</span></button>
        <button type="button" data-act="theme" aria-label="Đổi thời kỳ" title="Đổi thời kỳ (T)"><i>⏳</i><span>2010</span></button>
      </div>
      <!-- how it is arranged -->
      <div class="dock-group" role="group" aria-label="Bố cục">
        <button type="button" data-act="add" aria-label="Thêm một bảng" title="Thêm một bảng (A)"><i>＋</i><span>THÊM BẢNG</span></button>
        <button type="button" data-act="relayout" aria-label="Tạo bố cục mới" title="Bố cục ngẫu nhiên mới (N)"><i>▦</i><span>BỐ CỤC MỚI</span></button>
      </div>
      <!-- undoing it -->
      <div class="dock-group" role="group" aria-label="Lịch sử">
        <button type="button" data-act="undo" aria-label="Hoàn tác" title="Hoàn tác (Ctrl+Z)" disabled><i>↶</i><span>HOÀN TÁC</span></button>
        <button type="button" data-act="redo" aria-label="Làm lại" title="Làm lại (Ctrl+Y)" disabled><i>↷</i><span>LÀM LẠI</span></button>
      </div>
      <!-- taking it away -->
      <div class="dock-group" role="group" aria-label="Xuất file">
        <button type="button" data-act="export" aria-label="Xuất ảnh PNG" title="Xuất PNG — bảng đang chọn, hoặc cả tường nếu chưa chọn bảng nào"><i>🖼</i><span>XUẤT PNG</span></button>
        <button type="button" data-act="export-svg" aria-label="Xuất file SVG" title="Xuất SVG vector — bảng đang chọn, hoặc cả tường nếu chưa chọn bảng nào"><i>✎</i><span>XUẤT SVG</span></button>
      </div>
      <!-- the app itself -->
      <div class="dock-group" role="group" aria-label="Công cụ">
        <button type="button" data-act="fonts" aria-label="Mở bảng chọn font" aria-pressed="false" aria-controls="drawer" title="Hệ font (F)"><i>🔤</i><span>FONT</span></button>
        <button type="button" data-act="hide" aria-label="Ẩn bảng điều khiển" title="Ẩn bảng điều khiển (H)"><i>👁</i><span>ẨN</span></button>
      </div>
    </div>
  </div>
  <button type="button" class="peek" id="peek">▲ HIỆN BẢNG ĐIỀU KHIỂN</button>

  <aside class="drawer" id="drawer" hidden aria-label="Hệ font UTM">
    <button type="button" class="drawer-close" id="drawerClose" aria-label="Đóng">✕</button>
    <div>
      <p class="eyebrow">FONT DIRECTORY</p>
      <h2>HỆ FONT UTM</h2>
    </div>
    <p class="hint" id="drawerHint">Bấm vào một bảng trên tường để chọn.</p>
    <div class="face-grid">
      <label>Dòng loại hình<select id="faceCat"></select></label>
      <label>Tên tiệm<select id="faceName"></select></label>
      <label>Slogan<select id="faceTagline"></select></label>
      <label>Chân bảng<select id="faceFooter"></select></label>
    </div>
    <div class="drawer-actions">
      <button type="button" id="shuffleFace">ĐỔI KIỂU CHỮ</button>
      <button type="button" id="resetFace">VỀ CÔNG THỨC</button>
    </div>
    <p class="font-status" id="fontStatus">Đang dò font…</p>
    <div class="font-drop" id="dropzone">
      <p>Có font UTM thật? Kéo thả .TTF / .OTF vào đây. File chỉ nằm trong trình duyệt này.</p>
      <input type="file" id="fontFiles" multiple accept=".ttf,.otf,.woff,.woff2" hidden>
      <button type="button" id="pickFonts">CHỌN FILE FONT</button>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/utm-fonts.js"></script>
  <script src="js/sg85-fonts.js"></script>
  <script src="plaza.js"></script>
</body>
</html>
